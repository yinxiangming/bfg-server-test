name: Security HTTP E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace-security-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out E2E suite
        uses: actions/checkout@v4

      - name: Check out pinned BFG server
        uses: actions/checkout@v4
        with:
          repository: yinxiangming/bfg-server-django
          ref: 77f742398b043432cb03954f8ad2698bd30299a4
          path: .server

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .server/requirements.txt

      - name: Install server and E2E dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0
          python -m pip install -r .server/requirements.txt -r requirements.txt

      - name: Mark server checkout as disposable scratch
        run: printf '%s\n' 'bfg2-e2e-server-scratch-v1' > .server/.bfg-e2e-scratch

      - name: Verify target safety guard
        run: python -m pytest tests/ -q

      - name: Run disposable production-mode HTTP E2E
        env:
          BFG2_E2E_SERVER_DIR: ${{ github.workspace }}/.server
          BFG2_E2E_SERVER_PYTHON: ${{ env.pythonLocation }}/bin/python
          BFG2_E2E_SERVER_SCRATCH_MARKER: ${{ github.workspace }}/.server/.bfg-e2e-scratch
        run: bash scripts/run_disposable_workspace_e2e.sh
